<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atv 9</title>
</head>
<body>
    <script>
        let nome = prompt("Nome do usuário:");
        let senha = prompt("Digite a senha:");
        let nivel = prompt("Nível de acesso");
        
        if (senha !== "js123") {
            console.log("Acesso negado")
        } else {
            if ((nome === "admin") && (nivel != 3)) {
            console.log("Usuário admin precisa de nível 3");
        } else {
        switch (nivel) {
            case "1":
                console.log("Acesso básico liberado");
                break;
            case "2":
                console.log("Acesso intermediário liberado");
                break;
            case "3":
                console.log("Acesso administrativo liberado");
                break;
            default:
                console.log("Nível inválido.");
        }
    }
}
    </script>
</body>
</html>
