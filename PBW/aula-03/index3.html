<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 3</title>
</head>
<body>
    <script>
        let idade = Number(prompt("Digite a idade: "));

        if (idade < 12) {
            console.log("Criança");
        } else if (idade <= 17) {
            console.log("Adolescente");
        } else if (idade <= 59) {
            console.log("Adulto")
        } else {
            console.log("Idoso");
        }
    </script>
    
</body>
</html>
