<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 5</title>
</head>
<body>
    <script>
        let consumo = Number(prompt("Digite o consumo de energia (kw/h):"))
        tarifa = 0
        tratativa = 0
        if (consumo <= 50) {
            tarifa = 0.50
        } else if (consumo <= 100) {
            tarifa = 0.75
        } else {
            tarifa = 1.20
        }

        let conta = consumo * tarifa

        if (conta > 100) {
            conta_final = conta + (conta * 0.12)
            tratativa  = conta * 0.12
            console.log(`Consumo: R$${consumo}kw/h\nValor bruto: R$${conta} \nAcréscimo de R$: ${tratativa} \nValor final: R$${conta_final.toFixed(2)}`)
        } else if (consumo <= 30) {
            conta_final = conta - (conta * 0.05)
            tratativa = conta * 0.05
            console.log(`Consumo: R$${consumo}kw/h \nValor bruto: R$ ${conta} \nDesconto de R$: ${tratativa.toFixed(2)} \nValor final: R$${conta_final.toFixed(2)}`)
        } else {
            console.log(`Sem desconto ou acréscimo. \nConsumo: ${consumo} \nValor bruto: R$${conta} \nValor final: R$${conta}`)
        }

    </script>
</body>
</html>
