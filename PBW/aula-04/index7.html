<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atv7</title>
</head>
<body>
    <script>
        let tabuada = Number(prompt("Digite o número base da tabuada: "))
        for (let i = 1; i <= 10; i++) {
            let result = tabuada * i
            console.log(`${tabuada} x ${i} = ${result}`) 
        }
    </script>
</body>
</html>
